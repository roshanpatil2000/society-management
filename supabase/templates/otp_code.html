<!doctype html>
<html>
  <body
    style="
      font-family: Arial, sans-serif;
      color: #1f2937;
      max-width: 480px;
      margin: 0 auto;
      padding: 24px;
    "
  >
    <h2 style="margin: 0 0 16px">Your sign-in code</h2>
    <p>Enter this code in the Society App to sign in:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 6px; margin: 24px 0">
      {{ .Token }}
    </p>
    <p>
      The code expires in 10 minutes and works once. If you didn't try to sign in, you can ignore
      this email.
    </p>
  </body>
</html>
